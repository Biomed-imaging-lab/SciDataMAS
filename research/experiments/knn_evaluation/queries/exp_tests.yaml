[
  {
    "id":1,
    "topic":"Neurodegenerative impact on mice behavioral and neurons activity",
    "field_of_science": "biology/neuroscience",
    "llm_query":"Hi. I want to create a dataset with a metadata table for miniscope calcium imaging data from neuronal ensembles in the CA1 region of the hippocampus in C57BL/6J mice during a social/non-social recognition test. Neuronal activity was recorded from CA1 pyramidal neurons expressing the genetically encoded calcium indicator GCaMP6f delivered using the viral vector AAV5.CaMKII.GCaMP6f.WPRE.SV40. Calcium activity was acquired using a head-mounted miniscope through an implanted GRIN lens while freely behaving mice explored social stimuli and non-social objects across habituation, familiarization, and recognition phases. Behavioral video was synchronized with neural recordings to annotate stimulus approach, investigation bouts, zone transitions, social versus object exploration, and familiar versus novel stimulus preference. Calcium traces were motion-corrected, segmented into neuronal regions of interest, deconvolved, and analyzed to identify activity patterns and neuronal ensembles associated with social investigation, object exploration, and recognition memory. Behavioral metrics, including investigation time, latency to approach, locomotor activity, social preference index, and novelty recognition index, were quantified for each trial. The data is designed to map CA1 neural population dynamics underlying social and non-social recognition and to determine how hippocampal ensembles encode stimulus identity, novelty, and memory-guided exploratory behavior."
  },
    {
    "id":2,
    "topic":"Quant_chem_1",
    "field_of_science": "biology/quant_chem",
    "llm_query":"Hi. I want to create a dataset with a metadata table for a quantum chemistry computation of equilibrium geometry optimization of thiocyanic acid (HSCN) using restricted Hartree–Fock with three basis sets: STO-3G, 3-21G, and 6-31G*. For each basis set the dataset includes electronic structure parameters (total, electronic, and nuclear repulsion energies, virial ratio, SCF iterations, primitives count, computation time), optimized molecular geometry (H–S, S–C, C–N bond lengths; N–C–S, H–S–C bond angles), Mulliken atomic charges for H, S, C, and N, Mulliken bond orders for all three bonds, and frontier molecular orbital composition (HOMO and LUMO atomic orbital contributions, symmetry, and bonding character) for the STO-3G calculation. The dataset is designed to investigate basis set dependence of predicted geometry and electronic structure in a small inorganic molecule."
  },
    {
    "id":3,
    "topic":"Quant_chem_2",
    "field_of_science": "biology/quant_chem",
    "llm_query":"Hi. I want to create a dataset with a metadata table for a computational quantum chemistry study comparing pi-conjugated heteroaromatic molecules - including indole, isoindole, indolizine, and their oxygen- and sulfur-containing fused-ring analogues - to determine how heteroatom identity (N, O, S), position, and ring connectivity affect pi-electron delocalization and electronic properties. For each molecule the dataset includes equilibrium geometry parameters (bond lengths, bond orders, ring planarity), ground-state electronic structure (total energy, dipole moment, pi-HOMO and pi-LUMO energies, HOMO-LUMO gap, orbital shapes and nodal patterns, Mulliken charge distribution), reactivity descriptors (electrophilic and nucleophilic substitution site preferences derived from frontier orbital localization), and for selected molecules excited-state parameters (excitation energy, transition wavelength, oscillator strength, transition dipole moment, dominant one-electron transitions). The dataset is designed to quantify how heteroatom electronegativity, lone-pair participation, and orbital size influence bond length alternation, aromatic stabilization, frontier orbital energies, molecular polarity, and predicted reactivity across the series."
  },
    {
    "id":4,
    "topic":"Moleular dynamics 1",
    "field_of_science": "biology/mol_dynamics",
    "llm_query":"Hi. I want to create a dataset with a metadata table for a molecular docking and virtual screening study of transglycosylation regioselectivity by alpha-galactosidase TmGalA (PDB: 1ZY9), comparing a library of mono-, di-, and oligosaccharide ligands and p-nitrophenyl galactose derivatives as glycosyl acceptors. For each ligand the dataset includes molecular descriptors (formula, molecular weight, rotatable bonds, H-bond donors and acceptors, hydroxyl group labels), rigid and flexible docking results (rank, score, estimated binding free energy, best pose coordinates), active-site interaction profile (contacting residues within 4–7 Å, hydrogen bond partners, steric clashes), and the critical geometric parameter - distance from each candidate hydroxyl oxygen (O2, O3, O4, O6) to the anomeric C1 of the galactosyl-enzyme intermediate formed at Asp327, with Asp387 as the acid-base residue. Results are included for wild-type TmGalA and selected active-site mutants, recording for each variant how amino acid substitutions alter ligand ranking, binding affinity, hydrogen bond networks, and the preferred attacking hydroxyl group. The dataset is designed to identify catalytically productive binding poses and predict the regioisomeric distribution of transglycosylation products across the acceptor library and enzyme variants."
  },
    {
    "id":5,
    "topic":"Moleular dynamics 2",
    "field_of_science": "biology/mol_dynamics",
    "llm_query":"Hi. I want to create a dataset with a metadata table for molecular dynamics (MD) simulation trajectories and surface plasmon resonance (SPR) kinetic data evaluating the binding efficiency of a novel small-molecule inhibitor library against wild-type and mutated variants of human dihydrofolate reductase (DHFR). MD simulations were performed using GROMACS with the CHARMM36m force field, spanning 1-microsecond production runs per system in an explicit TIP3P water model with periodic boundary conditions. The trajectory data includes structural configurations, root-mean-square deviation (RMSD), root-mean-square fluctuation (RMSF), and hydrogen bonding profiles. In parallel, experimental SPR assays were conducted to determine the binding kinetics (k_on, k_off) and steady-state dissociation constants (K_d) across varying temperatures and inhibitor concentrations. The metadata maps simulation parameters (temperature, pressure, ensemble types, ionic strength) directly to the corresponding wet-lab biochemical metrics, structural PDB IDs, and mutation annotations. This dataset is designed to train machine learning models for predicting mutation-induced drug resistance, optimizing binding thermodynamics, and understanding the conformational flexibility of the binding pocket under physiological conditions."
  },
    {
    "id":6,
    "topic":"Biophysics 1",
    "field_of_science": "biology/Biophysics",
    "llm_query":"Hi. I want to create a dataset with a metadata table for a fluorescence spectroscopy experiment measuring intramolecular Tyr-to-Trp FRET in proteins by comparing emission spectra at two excitation wavelengths - 280 nm (Tyr+Trp excitation) and 297 nm (near-selective Trp excitation) - in native and urea-denatured states. For each protein and state the dataset includes raw spectral records (excitation wavelength, emission wavelength range, fluorescence intensity, buffer composition, pH, temperature, protein concentration, denaturant type and concentration, replicate number) and spectral decomposition results from fitting the 297 nm spectra to an asymmetric Gaussian Trp component and the 280 nm spectra to three components (scaled Trp, symmetric Gaussian Tyr near 303–305 nm, constant baseline): Trp and Tyr peak positions, amplitudes, areas, relative contributions, spectral shift, baseline value, and R-squared. For each protein the dataset also includes PDB-derived structural descriptors calculated to explain FRET efficiency: mean and minimum Tyr–Trp distance, aromatic ring-centre distance, number of Tyr residues proximal to each Trp, solvent-accessible surface area of Tyr and Trp, local hydrophobicity, hydrogen bond count, presence of charged or polar neighbours, secondary structure assignment, and burial status. The dataset is designed to identify which structural factors - Tyr–Trp distance, compactness, hydrophobic burial, and intramolecular packing - govern Tyr-to-Trp FRET efficiency across a set of proteins."
  },
  {
    "id":7,
    "topic":"Biophysics 2",
    "field_of_science": "biology/Biophysics",
    "llm_query":"Hi. I want to create a dataset with a metadata table for a biophysical experiment comparing six cell disruption methods — osmotic shock, freeze-thaw cycles, sonication, detergent lysis, enzymatic treatment, and mechanical homogenization — for extracting a target protein from bacterial or mammalian cells. For each sample the dataset includes lysis condition parameters (cell type, biomass amount, buffer composition, pH, ionic strength, temperature, lysis duration, freeze-thaw cycle count, sonication power and duration, detergent type and concentration, enzyme type and concentration), clarification parameters (centrifugation speed and time), and extraction outcome metrics (total protein concentration, soluble protein yield, target protein concentration, lysate turbidity, insoluble pellet amount, replicate number). Protein quality is characterised by SDS-PAGE purity profile, spectrophotometric concentration, enzymatic activity, and specific activity. The dataset is designed to identify which disruption method achieves the best balance between protein yield, purity, and preservation of native functional activity across cell types and buffer conditions."
  },
  {
    "id":8,
    "topic":"Biophysics 3",
    "field_of_science": "biology/Biophysics",
    "llm_query":"Hi. I want to create a dataset with a metadata table for a protein purification experiment using ion-exchange chromatography (anion- or cation-exchange selected based on protein pI relative to buffer pH) starting from a clarified cell lysate. For each fraction the dataset includes column and loading parameters (protein name, predicted and measured pI, column type, stationary phase, buffer composition, pH, conductivity, salt concentration, sample volume, protein concentration at loading, flow rate, wash conditions, elution method, NaCl gradient range), per-fraction measurements (fraction number, fraction volume, absorbance at 280 nm, total protein concentration, target protein concentration, enzymatic activity, specific activity, SDS-PAGE band intensity, estimated purity, replicate number), and chromatographic stage label (load, wash, or elution fraction). The dataset is designed to determine how buffer pH relative to pI, ionic strength, and salt gradient control binding strength, elution profile, purification yield, purity, and retention of biological activity across chromatographic conditions."
  },
  {
    "id":9,
    "topic":"Neuroscience 2",
    "field_of_science": "biology/neuroscience",
    "llm_query":"Hi. I want to create a dataset with a metadata table for two-photon calcium imaging data recorded from neuronal populations in the mouse visual cortex. Neural activity was acquired using two-photon microscopy and converted into calcium fluorescence traces for individual neurons across multiple cortical regions. Recordings were separated according to visual cortex subregions to preserve anatomical specificity and to prevent data leakage between experimental splits. Calcium traces were preprocessed by removing extreme activity values exceeding three standard deviations from the signal distribution, with outliers clipped to reduce noise and recording artifacts. The resulting signals were normalized using min-max scaling. Each recording session was subsequently segmented into 100 temporal samples containing 400 frames each to standardize input length for downstream analysis. Training, validation, and test datasets were constructed from non-overlapping cortical regions to ensure strict spatial separation between data splits and to minimize information leakage during model evaluation. In addition to calcium activity traces, each neuron was associated with three-dimensional spatial coordinates obtained from imaging data. The dataset represents neuronal populations as spatially organized point clouds that can subsequently be transformed into graph-based representations for analysis of functional and structural relationships between neurons. The data is designed to support the study of large-scale neuronal dynamics, spatial organization of cortical activity, and graph-based modeling of neural population activity in the visual cortex."
  }
]

