# SciDataMAS bundle layer.
#
# One plugin row mounts both the data-lake service and the model-facing tools.
# User configuration belongs in the profile's cordis.patch.yml, for example:
#
# - id: scidatamas
#   config:
#     root: /data/scidatamas
#     author: A. Sachuk
#
- insert:
    - id: scidatamas
      name: scidatamas-dsh-plugin
      config:
        root: .scidatamas
