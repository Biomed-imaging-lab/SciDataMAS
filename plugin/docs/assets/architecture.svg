<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="SciDataMAS architecture">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#101d32"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5eead4"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#60a5fa"/>
    </marker>
  </defs>
  <rect width="1200" height="700" rx="18" fill="url(#abg)"/>
  <text x="48" y="58" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#f8fafc">SciDataMAS architecture</text>
  <text x="48" y="84" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" fill="#94a3b8">One service, two surfaces: agent tools and a DSH-native Web panel. Everything below the service is deterministic.</text>

  <!-- Web panel + tools -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="48" y="122" width="520" height="112" rx="12" fill="#0d1b2e" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="72" y="152" font-size="11" font-weight="600" letter-spacing="1.5" fill="#7dd3fc">DSH WEB · DATA PANEL</text>
    <text x="72" y="180" font-size="16" font-weight="600" fill="#f1f5f9">Catalog · schema · validation · samples</text>
    <text x="72" y="204" font-size="12" fill="#94a3b8">React client bundle · sidebar entry · read-only first</text>

    <rect x="632" y="122" width="520" height="112" rx="12" fill="#0d1b2e" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="656" y="152" font-size="11" font-weight="600" letter-spacing="1.5" fill="#ddd6fe">DSH AGENT · 11 TOOLS</text>
    <text x="656" y="180" font-size="16" font-weight="600" fill="#f1f5f9">create · DAG · validate · add · query · import</text>
    <text x="656" y="204" font-size="12" fill="#94a3b8">same session model via ctx.llm · staged writes</text>

    <path d="M308 234v38" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#b)"/>
    <path d="M892 234v38" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#b)"/>
    <text x="322" y="256" font-size="10" fill="#64748b">GET /scidatamas/api</text>
    <text x="906" y="256" font-size="10" fill="#64748b">tool calls</text>

    <!-- Service -->
    <rect x="48" y="282" width="1104" height="150" rx="12" fill="#0e1c30" stroke="#5eead4" stroke-opacity="0.45"/>
    <text x="72" y="314" font-size="11" font-weight="600" letter-spacing="1.5" fill="#99f6e4">SCIDATAMAS SERVICE</text>
    <text x="72" y="342" font-size="16" font-weight="600" fill="#f1f5f9">Workflows, schema normalization, validation, audit</text>
    <g font-size="11" fill="#cbd5e1">
      <rect x="72" y="364" width="146" height="40" rx="8" fill="#122a3e" stroke="#1e4d66"/><text x="145" y="389" text-anchor="middle">single-call schema</text>
      <rect x="232" y="364" width="146" height="40" rx="8" fill="#122a3e" stroke="#1e4d66"/><text x="305" y="389" text-anchor="middle">DAG augmentation</text>
      <rect x="392" y="364" width="146" height="40" rx="8" fill="#122a3e" stroke="#1e4d66"/><text x="465" y="389" text-anchor="middle">debate validation</text>
      <rect x="552" y="364" width="146" height="40" rx="8" fill="#122a3e" stroke="#1e4d66"/><text x="625" y="389" text-anchor="middle">stage / commit</text>
      <rect x="712" y="364" width="146" height="40" rx="8" fill="#122a3e" stroke="#1e4d66"/><text x="785" y="389" text-anchor="middle">safe retrieval</text>
      <rect x="872" y="364" width="146" height="40" rx="8" fill="#122a3e" stroke="#1e4d66"/><text x="945" y="389" text-anchor="middle">Zenodo / URL import</text>
      <rect x="1032" y="364" width="96" height="40" rx="8" fill="#1b2438" stroke="#a78bfa" stroke-opacity="0.4"/><text x="1080" y="389" text-anchor="middle" fill="#ddd6fe">audit</text>
    </g>

    <path d="M600 432v38" stroke="#5eead4" stroke-width="1.5" marker-end="url(#a)"/>

    <!-- Lake -->
    <rect x="48" y="480" width="700" height="112" rx="12" fill="#0d1b2e" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="72" y="510" font-size="11" font-weight="600" letter-spacing="1.5" fill="#7dd3fc">DATA LAKE (CONTROL + DATA PLANE)</text>
    <text x="72" y="538" font-size="15" font-weight="600" fill="#f1f5f9">catalog.json · manifests · metadata.jsonl · files/ · events</text>
    <text x="72" y="562" font-size="12" fill="#94a3b8">schema versions · validated marker · staging · validation reports</text>

    <!-- LLM -->
    <rect x="776" y="480" width="376" height="112" rx="12" fill="#0d1b2e" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="800" y="510" font-size="11" font-weight="600" letter-spacing="1.5" fill="#ddd6fe">MODEL ROUTE</text>
    <text x="800" y="538" font-size="15" font-weight="600" fill="#f1f5f9">ctx.llm.stream()</text>
    <text x="800" y="562" font-size="12" fill="#94a3b8">session model · JSON repair · durable audit log</text>

    <path d="M748 536h28" stroke="#5eead4" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M600 592v38" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#b)"/>

    <!-- Storage -->
    <rect x="48" y="630" width="1104" height="46" rx="10" fill="#0b1728" stroke="#1e3a5f"/>
    <text x="72" y="658" font-size="11" font-weight="600" letter-spacing="1.2" fill="#7dd3fc">STORAGE BACKEND</text>
    <text x="268" y="658" font-size="12" fill="#cbd5e1">LocalStorage today</text>
    <text x="430" y="658" font-size="12" fill="#64748b">·</text>
    <text x="450" y="658" font-size="12" fill="#cbd5e1">S3 extension point</text>
    <text x="600" y="658" font-size="12" fill="#64748b">·</text>
    <text x="620" y="658" font-size="12" fill="#cbd5e1">Synology extension point</text>
    <text x="1042" y="658" font-size="11" fill="#64748b">keys never escape the root</text>
  </g>
</svg>
