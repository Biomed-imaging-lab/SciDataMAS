<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="SciDataMAS — scientific data lake for DeepSeek Harness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#0d1b31"/>
      <stop offset="1" stop-color="#12233d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#7dd3fc" opacity="0.14"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5eead4"/>
    </marker>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)"/>
  <circle cx="1070" cy="40" r="150" fill="#60a5fa" opacity="0.06"/>
  <circle cx="1150" cy="270" r="120" fill="#5eead4" opacity="0.05"/>

  <text x="64" y="88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="3.5" fill="#5eead4">SCIDATAMAS</text>
  <text x="64" y="146" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="48" font-weight="700" fill="#f8fafc">Scientific data lake</text>
  <text x="64" y="190" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" fill="#cbd5e1">for DeepSeek Harness</text>
  <text x="64" y="227" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#94a3b8">Adaptive metadata · debate validation · staged ingestion · Zenodo import</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="500">
    <rect x="64" y="250" width="144" height="26" rx="13" fill="#0f2b3a" stroke="#2dd4bf" stroke-opacity="0.45"/>
    <text x="136" y="267" text-anchor="middle" fill="#99f6e4">local-first</text>
    <rect x="220" y="250" width="166" height="26" rx="13" fill="#12243b" stroke="#60a5fa" stroke-opacity="0.45"/>
    <text x="303" y="267" text-anchor="middle" fill="#bfdbfe">S3 / Synology ready</text>
    <rect x="398" y="250" width="154" height="26" rx="13" fill="#1d2438" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="475" y="267" text-anchor="middle" fill="#ddd6fe">DSH native UI</text>
  </g>

  <g transform="translate(748 38)">
    <rect x="0" y="0" width="390" height="224" rx="16" fill="#0b1728" stroke="#1e3a5f"/>
    <text x="22" y="32" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#7dd3fc">PROVENANCE, NOT FLAT FILES</text>

    <ellipse cx="195" cy="72" rx="82" ry="17" fill="#123047" stroke="#38bdf8" stroke-opacity="0.55"/>
    <path d="M113 72v54c0 9 37 17 82 17s82-8 82-17V72" fill="#0f2237" stroke="#38bdf8" stroke-opacity="0.55"/>
    <ellipse cx="195" cy="126" rx="82" ry="17" fill="#123047" stroke="#38bdf8" stroke-opacity="0.55"/>
    <text x="195" y="106" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" fill="#bae6fd">DATA LAKE</text>

    <g transform="translate(22 166)">
      <circle cx="14" cy="14" r="13" fill="#0e2a24" stroke="#5eead4"/>
      <text x="14" y="19" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#99f6e4">E</text>
      <text x="14" y="44" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#94a3b8">entity</text>
      <line x1="31" y1="14" x2="86" y2="14" stroke="#5eead4" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="94" y="2" width="58" height="24" rx="7" fill="#0e2434" stroke="#38bdf8"/>
      <text x="123" y="18" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#bae6fd">S</text>
      <text x="123" y="44" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#94a3b8">signal</text>
      <line x1="159" y1="14" x2="214" y2="14" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="222" y="2" width="58" height="24" rx="7" fill="#151c33" stroke="#a78bfa"/>
      <text x="251" y="18" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#ddd6fe">D</text>
      <text x="251" y="44" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9" fill="#94a3b8">derivative</text>
      <text x="292" y="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" fill="#64748b">metadata</text>
    </g>
  </g>

  <text x="64" y="286" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" fill="#64748b">Open source · MIT · research prototype</text>
</svg>
